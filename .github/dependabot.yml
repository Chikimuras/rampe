# Mises à jour hebdomadaires des dépendances et des actions (ADR-0009). Les PR passent par la CI normale.
version: 2
updates:
  - package-ecosystem: npm # couvre l'espace de travail pnpm (pnpm-lock.yaml à la racine)
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # Une seule PR pour les montées mineures et correctives des outils de dev.
      outils-dev:
        dependency-type: development
        update-types: [minor, patch]
        # axe-core reste seul : sa montée change la correspondance RGAA et doit se lire isolément (ADR-0008).
        exclude-patterns: [axe-core]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
