# Publication de la CLI sur npm (ADR-0025 §5) : étiquette `v<version>` posée sur main, gate complet, puis publication
# par Trusted Publishing (identité OIDC de GitHub Actions), sans jeton npm stocké, avec attestation de provenance.
# Deux jobs : `build` vérifie, teste et produit l'archive sans aucun droit d'écriture ; `publish`, seul à pouvoir
# demander un jeton OIDC, ne fait que publier cette archive (ni installation de dépendances, ni test, ni build).
name: Publication npm

on:
  push:
    tags: ["v*"]

# Moindre privilège par défaut — OWASP Top 10 CI/CD, CICD-SEC-5 ; chaque job déclare le sien.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # Mêmes actions et versions que ci.yml, épinglées par SHA — OWASP Top 10 CI/CD, CICD-SEC-3.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Historique complet : nécessaire pour vérifier que le commit étiqueté est sur main.
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # Aucun cache pour une publication : recommandation de la documentation npm (Trusted publishing, étape 2).
          package-manager-cache: false
      - name: Vérifier que l'étiquette correspond à la version du paquet
        run: |
          version="v$(node -p 'require("./packages/cli/package.json").version')"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "L'étiquette $GITHUB_REF_NAME ne correspond pas à la version de packages/cli/package.json ($version)."
            exit 1
          fi
      # Ne publie que du code fusionné (ADR-0025, Conséquences) : une étiquette posée sur une autre branche est refusée.
      - name: Vérifier que le commit étiqueté est sur main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Le commit $GITHUB_SHA de l'étiquette $GITHUB_REF_NAME n'est pas sur main : publication refusée."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      # Gate complet, comme ci.yml : Chromium et profil AppArmor (voir ci.yml), puis pnpm check.
      - run: pnpm --filter @chikimuras/rampe exec playwright install --with-deps chromium
      - name: Autoriser le bac à sable de Chromium (AppArmor)
        run: |
          printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' \
            'profile playwright-chromium /home/runner/.cache/ms-playwright/**/chrome* flags=(unconfined) {' \
            '  userns,' '}' | sudo tee /etc/apparmor.d/playwright-chromium
          sudo apparmor_parser -r /etc/apparmor.d/playwright-chromium
      - run: pnpm check
      # Test du paquet réel (archive installée dans un dossier vierge), hors de pnpm check car il demande le registre.
      - run: pnpm --filter @chikimuras/rampe test:paquet
      # npm pack lance le build (prepack) : une seule construction, celle de l'archive publiée.
      - run: npm pack --pack-destination "$RUNNER_TEMP/paquet"
        working-directory: packages/cli
      # Épinglée par SHA (CICD-SEC-3), à une version publiée depuis plus de 2 semaines.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paquet-npm
          path: ${{ runner.temp }}/paquet/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Environnement GitHub « npm » : déclaré aussi dans l'éditeur de confiance sur npmjs.com, ses règles de protection
    # s'appliquent avant que le jeton OIDC puisse être demandé.
    environment: npm
    # Jeton OIDC limité à ce job — CICD-SEC-5 ; aucun jeton npm de longue durée — CICD-SEC-6 ; provenance — CICD-SEC-9.
    # GitHub, « Security hardening with OpenID Connect » : n'accorder id-token: write qu'au job qui en a besoin.
    permissions:
      contents: read
      id-token: write
    steps:
      # Épinglée par SHA (CICD-SEC-3), à une version publiée depuis plus de 2 semaines.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: paquet-npm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # Aucun cache pour une publication : recommandation de la documentation npm (Trusted publishing, étape 2).
          package-manager-cache: false
      # Trusted Publishing demande npm ≥ 11.5.1 (documentation npm) ; Node 22 livre npm 10. Version exacte.
      - run: npm install -g npm@11.21.0
      # Archive produite par le job build, publiée telle quelle (pas de prepack sur une archive).
      - run: npm publish "chikimuras-rampe-${GITHUB_REF_NAME#v}.tgz" --provenance --access public
