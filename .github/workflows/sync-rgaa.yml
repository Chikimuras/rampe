# Synchro hebdomadaire du référentiel RGAA par PR automatique (ADR-0009).
# La PR n'est jamais mergée ici : ce workflow n'appelle jamais `gh pr merge` (ADR-0006).
name: Synchro RGAA

on:
  schedule:
    - cron: "17 6 * * 1" # chaque lundi, 06:17 UTC (décalé de l'heure pile, saturée chez GitHub)
  workflow_dispatch:
    inputs:
      ref:
        description: "Branche, tag ou SHA du dépôt DINUM (défaut : main)"
        required: false
        type: string

# Aucun droit par défaut ; le job ne reçoit que le strict nécessaire — OWASP Top 10 CI/CD, CICD-SEC-5.
permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync:
    # Seule la définition du workflow sur main tourne avec ces droits, pas celle d'une autre branche.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # pousser la branche chore/sync-rgaa-*
      pull-requests: write # ouvrir la PR
      actions: write # déclencher ci.yml sur la branche (workflow_dispatch) et lister ses exécutions
    steps:
      # Actions épinglées par SHA — OWASP Top 10 CI/CD, CICD-SEC-3.
      # persist-credentials: false : le jeton n'est pas écrit dans .git/config pour tout le job ;
      # il n'est fourni qu'à l'étape qui pousse, via un en-tête HTTP éphémère (CICD-SEC-6).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Pas de `pnpm install` : le script n'utilise que la bibliothèque standard de Node. Ne pas
      # exécuter les scripts d'installation des dépendances dans un job qui a des droits d'écriture
      # (CICD-SEC-3) ; la CI déclenchée sur la branche installe et teste tout, sans ces droits.

      # Les valeurs issues des entrées ne sont jamais interpolées par ${{ }} dans `run:` : elles passent
      # par `env:` et sont lues comme variables shell, ce qui empêche l'injection de script
      # (OWASP Top 10 CI/CD, CICD-SEC-4 ; GitHub, « Security hardening for GitHub Actions »).
      # Le contenu téléchargé n'est jamais exécuté : seulement validé comme JSON puis écrit.
      - id: sync
        env:
          REF: ${{ inputs.ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node packages/core/scripts/sync-rgaa.mjs "${REF:-main}" --if-changed

      # Idempotent : chaque étape (branche, PR, CI) n'est faite que si elle manque, pour reprendre
      # proprement après un échec partiel. `set -euo pipefail` : toute commande gh/git en échec fait
      # échouer le job (jamais de vert silencieux).
      - if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sync.outputs.sha }}
          PREVIOUS: ${{ steps.sync.outputs.previous }}
        run: |
          set -euo pipefail
          short="${SHA:0:7}"
          branch="chore/sync-rgaa-${short}"
          title="chore(core): synchro du référentiel RGAA (DINUM ${short})"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::${auth}"
          git_auth() { git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" "$@"; }

          # 1. Branche : une par commit DINUM, poussée seulement si elle n'existe pas encore.
          head="$(git_auth ls-remote origin "refs/heads/${branch}" | cut -f1)"
          if [ -z "$head" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git switch -c "$branch"
            git add packages/core/data/rgaa
            git commit -m "$title"
            git_auth push origin "HEAD:refs/heads/${branch}"
            head="$(git rev-parse HEAD)"
          else
            echo "La branche ${branch} existe déjà (${head}) : reprise."
          fi

          # 2. PR : créée seulement s'il n'en existe aucune (ouverte, fermée ou mergée) pour cette branche.
          prs="$(gh pr list --head "$branch" --state all --json number --jq length)"
          if [ "$prs" -eq 0 ]; then
            repo="https://github.com/DISIC/accessibilite.numerique.gouv.fr"
            diff_line="- Diff DINUM : premier import, pas de commit précédent."
            if [ -n "$PREVIOUS" ]; then
              diff_line="- Diff DINUM depuis l'import précédent : ${repo}/compare/${PREVIOUS}...${SHA}"
            fi
            cat > "$RUNNER_TEMP/pr-body.md" <<EOF
          Synchro automatique du référentiel RGAA (ADR-0009).

          - Commit DINUM source : [\`${SHA}\`](${repo}/commit/${SHA})
          ${diff_line}

          ## À faire par le relecteur

          - [ ] **Confirmer la version du RGAA** dans \`packages/core/data/rgaa/source.json\` : elle a été reprise de l'import précédent et n'est pas déductible des fichiers.
          - [ ] Relire \`git diff packages/core/data\` : c'est là qu'on voit ce que la DINUM a changé.
          - [ ] La CI (check \`check\`) doit passer avant tout merge ; elle a été déclenchée sur cette branche par \`workflow_dispatch\`.
          EOF
            gh pr create --base main --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/pr-body.md"
          else
            echo "Une PR existe déjà pour ${branch}."
          fi

          # 3. CI : une PR ouverte avec le GITHUB_TOKEN ne déclenche pas `pull_request` ; on lance ci.yml
          # pour que le check requis `check` s'attache au commit de tête (ADR-0009), sauf si une exécution
          # de ci.yml existe déjà sur ce commit. On interroge les exécutions (actions: read) plutôt que les
          # check runs, qui demanderaient en plus `checks: read`.
          runs="$(gh run list --workflow ci.yml --commit "$head" --json databaseId --jq length)"
          if [ "$runs" -eq 0 ]; then
            gh workflow run ci.yml --ref "$branch"
          else
            echo "ci.yml a déjà tourné sur ${head}."
          fi
