# Gate final (ADR-0006) : rien ne se merge ni ne part en prod sans ce workflow vert.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Moindre privilège par défaut — OWASP Top 10 CI/CD, CICD-SEC-5.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions épinglées par SHA — OWASP Top 10 CI/CD, CICD-SEC-3.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chromium pour les tests de bout en bout de la CLI (ADR-0011 §5), de /audit/ (ADR-0013 §5) et de l'extension
      # (ADR-0019 §7), même version de Playwright.
      - run: pnpm --filter @rampe/cli exec playwright install --with-deps chromium
      # Ubuntu 24.04 interdit par AppArmor les espaces de noms utilisateur dont le bac à sable de Chromium a besoin.
      # Profil ciblé sur les seuls binaires Playwright plutôt que --no-sandbox ou un sysctl global (ADR-0011 §6) :
      # https://chromium.googlesource.com/chromium/src/+/main/docs/security/apparmor-userns-restrictions.md
      - name: Autoriser le bac à sable de Chromium (AppArmor)
        run: |
          printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' \
            'profile playwright-chromium /home/runner/.cache/ms-playwright/**/chrome* flags=(unconfined) {' \
            '  userns,' '}' | sudo tee /etc/apparmor.d/playwright-chromium
          sudo apparmor_parser -r /etc/apparmor.d/playwright-chromium
      - run: pnpm check
      - run: pnpm build
      # Archive de l'extension navigateur, pour un test manuel (ADR-0019 §7). Aucune permission supplémentaire :
      # l'envoi d'artefacts passe par le jeton d'exécution du job, pas par GITHUB_TOKEN.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: packages/extension/rampe-extension.zip
          # Le .zip est déjà l'archive de l'extension : envoyé tel quel, sans second zip autour.
          archive: false
          if-no-files-found: error
          retention-days: 30
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/site/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
