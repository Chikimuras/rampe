const W = f.contentWindow;
W.eval('addEventListener("message", (e) => {\n  let d; try { d = JSON.parse(e.data); } catch { return; }\n  if (!d || !d.topic) return;\n  const reply = (payload) => parent.postMessage(JSON.stringify({ channelId: d.channelId, topic: null, messageId: crypto.randomUUID() + ":" + crypto.randomUUID(), keepalive: false, source: d.source, payload }), "*");\n  parent.document.body.dataset.seen = (parent.document.body.dataset.seen || "") + d.topic + ";";\n  if (d.topic === "axe.ping") reply({ axe: true });\n  if (d.topic === "axe.start") reply(["image-alt","label","color-contrast","html-has-lang"].map((id)=>({ id, result: "failed", nodes: [{ node: { "selector": ["#zzz"], "ancestry": ["html"], "xpath": ["/html"], "source": "<x>", "nodeIndexes": [0], "fromFrame": false }, any: null, all: [], none: [] }] })));\n});\n');
