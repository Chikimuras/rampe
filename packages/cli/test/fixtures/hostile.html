<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Page hostile</title>
		<script>
			// Page piège (ADR-0020) : avant toute injection, elle tente de falsifier son propre audit.
			// Faux axe, impossible à remplacer : 0 violation.
			Object.defineProperty(window, "axe", {
				configurable: false,
				get: () => ({ version: "4.14.0", run: async () => ({ violations: [], incomplete: [], passes: [] }) }),
			});
			// Primitives cassées : l'affichage n'en dépend pas, un audit exécuté dans ce monde-ci si.
			Element.prototype.getAttribute = () => "x";
			window.getComputedStyle = () => ({ getPropertyValue: () => "", display: "none", visibility: "hidden" });
			Array.prototype.filter = () => [];
			JSON.stringify = () => '{"violations":[],"incomplete":[]}';
		</script>
		<style>
			.pale { color: #bbb; background: #fff; }
		</style>
	</head>
	<body>
		<main>
			<h1>Page hostile</h1>
			<!-- Mêmes défauts que defauts.html -->
			<!-- 1.1 : image sans alternative -->
			<img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" width="10" height="10" />
			<!-- 11.1 : champ sans étiquette -->
			<input type="text" />
			<!-- 3.2 : contraste insuffisant (#bbb sur blanc) -->
			<p class="pale">Texte trop pâle.</p>
			<!-- 8.3 : pas d’attribut lang sur html -->
			<span id="double"></span><span id="double"></span>
		</main>
	</body>
</html>
