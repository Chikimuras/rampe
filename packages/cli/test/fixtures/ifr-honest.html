<!doctype html>
<html><head><meta charset="utf-8" /><style>.pale { color: #bbb; background: #fff; }</style><title>Iframe honnete</title></head>
<body><main>
<h1>Page avec défauts connus</h1>
<img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" width="10" height="10" />
<input type="text" />
<p class="pale">Texte trop pâle.</p>
<span id="double"></span><span id="double"></span>
<iframe title="cadre" id="f"></iframe>
</main>
<script>
const f = document.getElementById("f");
f.contentDocument.open(); f.contentDocument.write('<!doctype html><html lang="fr"><title>c</title><body>cadre</body></html>'); f.contentDocument.close();
const W = f.contentWindow;
void ("message", (e) => {
  let d; try { d = JSON.parse(e.data); } catch { return; }
  if (!d || !d.topic) return;
  const reply = (payload) => W.parent.postMessage(JSON.stringify({ channelId: d.channelId, topic: null, messageId: crypto.randomUUID() + ":" + crypto.randomUUID(), keepalive: false, source: d.source, payload }), "*");
  document.body.dataset.seen = (document.body.dataset.seen || "") + d.topic + ";";
  if (d.topic === "axe.ping") reply({ axe: true });
  if (d.topic === "axe.start") reply(null);
});
</script></body></html>
